name: Build UniCore APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Debug APK (Zero-Cost CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "::error::app/google-services.json was not pushed by AI Studio. Add repository secret GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          echo "Debug APK SHA fingerprints:"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Security & Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.SecurityAuditTest --tests com.example.ExampleUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload UniCore Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniCore-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::error::Missing GOOGLE_SERVICES_JSON secret."
              exit 1
            fi
          fi

      - name: Check release signing secrets
        id: release_check
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not set. Skipping Release APK build."
          fi

      - name: Set up JDK 21
        if: steps.release_check.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        if: steps.release_check.outputs.enabled == 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare release keystore and verify alias
        if: steps.release_check.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, re, sys

          raw = os.environ.get("RELEASE_KEYSTORE_BASE64", "")
          cleaned = re.sub(r"\s+", "", raw)
          if not cleaned:
              print("::error::RELEASE_KEYSTORE_BASE64 is empty.")
              sys.exit(1)

          if ":" in cleaned or "SHA1" in cleaned or "SHA256" in cleaned:
              print(f"::error::RELEASE_KEYSTORE_BASE64 looks like a SHA fingerprint or text label (length={len(cleaned)}), not the Base64 keystore (~2800+ chars from key.txt).")
              sys.exit(1)

          if len(cleaned) < 500:
              print(f"::error::RELEASE_KEYSTORE_BASE64 is too short (length={len(cleaned)} chars). A JKS keystore in Base64 is ~2800-3500 chars.")
              sys.exit(1)

          cleaned += "=" * (-len(cleaned) % 4)
          try:
              data = base64.b64decode(cleaned, validate=True)
          except Exception as exc:
              print(f"::error::RELEASE_KEYSTORE_BASE64 is not valid Base64 (length={len(cleaned)}): {exc}")
              sys.exit(1)

          out_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "my-upload-key.jks")
          with open(out_path, "wb") as f:
              f.write(data)
          print(f"Decoded my-upload-key.jks ({len(data)} bytes).")
          PY
          echo "Release APK SHA fingerprints (add SHA1 in Firebase Project Settings for Google Sign-In):"
          keytool -list -v -keystore "${{ github.workspace }}/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias upload | grep -E "SHA1:|SHA256:"

      - name: Set up Gradle 9.3.1
        if: steps.release_check.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Signed Release APK
        if: steps.release_check.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload UniCore Release APK
        if: steps.release_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UniCore-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up sensitive keystores
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"
